[package]
name = "vofluid-app"
version = "0.1.0"
edition = "2024"

[features]
default = []
profile = ["vofluid-core/profile", "dep:serde", "dep:serde_json"]

[dependencies]
winit.workspace = true
wgpu = { workspace = true }
notify.workspace = true
pollster.workspace = true
anyhow.workspace = true
env_logger = { workspace = true }
log.workspace = true
glam = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
vofluid-render = { path = "../vofluid-render" }
vofluid-core = { path = "../vofluid-core", features = ["all"] }
